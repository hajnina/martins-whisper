name: Android native build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK/NDK/CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Fetch pinned whisper.cpp
        run: scripts/fetch-whisper-cpp.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build
        run: gradle --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: martins-whisper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
